x-airflow-common: &airflow-common
  build: .
  image: pim-airflow:3.1.6
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Execute scripts/configure_local.py}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Execute scripts/configure_local.py}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Execute scripts/configure_local.py}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?Execute scripts/configure_local.py}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/runtime/airflow-passwords.json
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/adc.json
    GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:?Configure o projeto}
    GCS_BRONZE_BUCKET: ${GCS_BRONZE_BUCKET:?Configure o bucket Bronze}
    GCS_SILVER_BUCKET: ${GCS_SILVER_BUCKET:?Configure o bucket Silver}
    BQ_DATASET: ${BQ_DATASET:-pim}
    BQ_LOCATION: ${BQ_LOCATION:-southamerica-east1}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - ./runtime:/opt/airflow/runtime
    - type: bind
      source: ${GOOGLE_ADC_PATH:?Informe o caminho externo do ADC}
      target: /opt/airflow/adc.json
      read_only: true
      bind:
        create_host_path: false
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute scripts/configure_local.py}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: db migrate
    restart: "no"

  airflow-api:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 60s
      timeout: 60s
      start_period: 120s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
