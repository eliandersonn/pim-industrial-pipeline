[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pim-industrial-pipeline"
version = "0.1.0"
description = "Pipeline de indicadores da producao industrial do IBGE SIDRA 8888"
requires-python = ">=3.12,<3.13"
dependencies = ["requests==2.32.5", "google-cloud-storage==3.7.0", "google-cloud-bigquery==3.39.0", "pyarrow==18.1.0", "tzdata==2025.3"]

[project.scripts]
pim-pipeline = "pim_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
